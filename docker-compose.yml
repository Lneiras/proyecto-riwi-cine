services:
  app:
    build: ./app
    container_name: ${APP_CONTAINER_NAME}
    working_dir: /usr/src/app
    # En desarrollo se usa hot-reload (ts-node-dev). La imagen multi-stage
    # queda disponible para producción (node dist/index.js).
    command: npx ts-node-dev --respawn --transpile-only src/index.ts
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./app:/usr/src/app
      - ./.env:/usr/src/app/.env
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - db
      - redis
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT}"
          memory: ${APP_MEM_LIMIT}
    networks:
      - backend
  realtime:
    build: ./app
    container_name: riwi-cine-realtime
    working_dir: /usr/src/app
    command: npx ts-node-dev --respawn --transpile-only src/realtime/server.ts
    ports:
      - "${SOCKET_PORT}:${SOCKET_PORT}"
    volumes:
      - ./app:/usr/src/app
      - ./.env:/usr/src/app/.env
    env_file:
      - ./.env
    environment:
      - NODE_ENV=${NODE_ENV}
      - REDIS_URL=redis://redis:6379
      - SOCKET_PORT=${SOCKET_PORT}
      - CORS_ORIGINS=${CORS_ORIGINS}
    depends_on:
      - redis
    networks:
      - backend

  db:
    image: postgres:15-alpine
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "${DB_CPU_LIMIT}"
          memory: ${DB_MEM_LIMIT}
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${PGADMIN_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: "${PGADMIN_CPU_LIMIT}"
          memory: ${PGADMIN_MEM_LIMIT}
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

volumes:
  db_data:
  redis_data:

networks:
  backend:
    driver: bridge
